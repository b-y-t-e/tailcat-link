name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly, so a newly published query finds this code without waiting for
    # the next push to a repository that may go quiet for months.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality

      - name: Build
        run: dotnet build --configuration Release

      - uses: github/codeql-action/analyze@v4
