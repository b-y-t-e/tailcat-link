name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # The zero-warning rule is only a rule if the build enforces it.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # The live tests dial Tailscale's public relays. They are opt-in so CI
      # neither depends on that service nor adds load to it; everything else
      # runs on every push.
      - name: Test
        run: dotnet test --no-build --configuration Release

  # Tailcat.Link bundles the assemblies of four projects that are not packages
  # of their own, and the three packages beside it depend on it as a package.
  # Both are easy to break without noticing, because the build stays green
  # either way — so all four are built and then actually consumed on every
  # push, by an application that uses each of them the way a consumer does.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack --configuration Release -o artifacts

      - name: Consume the package
        run: |
          set -euo pipefail
          # Read the version off the package that was just built, so a bump to
          # VersionPrefix does not silently turn this check into a no-op.
          # The digit keeps this off Tailcat.Link.Json and the rest, whose
          # names also start "Tailcat.Link.".
          pkg=$(ls artifacts/Tailcat.Link.[0-9]*.nupkg | head -1)
          version=${pkg#artifacts/Tailcat.Link.}
          version=${version%.nupkg}
          mkdir -p /tmp/consume && cd /tmp/consume
          dotnet new console -o app --force
          cd app
          # Runs code from every bundled layer, not just Tailcat.Link: an
          # assembly loads lazily, so merely naming a type the compiler can
          # resolve would still pass with the .dll missing from the package.
          # Sealing and opening a peer message goes through Tailcat.Net,
          # Tailcat's keys and libsodium at once, which is also what catches a
          # Sodium.Core dependency that the nuspec forgot to declare.
          cat > Program.cs <<'CSHARP'
          using System.Text.Json.Serialization;
          using Microsoft.Extensions.DependencyInjection;
          using Tailcat;
          using Tailcat.Derp;
          using Tailcat.Keys;
          using Tailcat.Link;
          using Tailcat.Link.Extensions.DependencyInjection;
          using Tailcat.Link.Json;
          using Tailcat.Link.Storage;
          using Tailcat.Net;
          using Tailcat.TestSupport;

          Console.WriteLine(InvitationCode.TryParse("nonsense", out _));
          Console.WriteLine(typeof(ConnBlob).Assembly.GetName().Name);

          // TAILCAT001: sealing a peer message is exactly what this check is
          // for — it runs code from Tailcat.Net, Tailcat and libsodium at once
          // — and the warning is about the design being unreviewed, not about
          // calling it here.
          #pragma warning disable TAILCAT001
          var host = NodePrivate.NewKey();
          var guest = NodePrivate.NewKey();
          byte[] ping = PeerMessage.Seal(PeerMessageType.Ping, "ping"u8, host, guest.Public());
          if (!PeerMessage.TryOpen(ping, guest, host.Public(), out _, out byte[]? payload))
          {
              throw new InvalidOperationException("the bundled Tailcat.Net could not open its own message");
          }
          Console.WriteLine(System.Text.Encoding.UTF8.GetString(payload));
          #pragma warning restore TAILCAT001

          // A static property rather than a const, which the compiler would
          // inline and leave Tailcat.Derp.dll unloaded.
          Console.WriteLine(DerpProtocol.Magic.Length);
          Console.WriteLine(typeof(DerpClient).Assembly.GetName().Name);

          // The three packages beside Tailcat.Link, each used the way its own
          // consumer would: a pair of links stood up on Tailcat.TestSupport's
          // in-memory relay, asked a question through Tailcat.Link.Json, and a
          // host registered as Tailcat.Link.Extensions.DependencyInjection
          // registers one. Registration only for that last: resolving it would
          // bring a node up, which belongs in the repository's own tests.
          using var deadline = new CancellationTokenSource(TimeSpan.FromMinutes(2));
          await using var relay = new FakeDerpRelay();
          var gateways = new FakeRelayGatewayFactory(relay);

          await using ILink hosting = await TailcatLink.HostAsync(
              "consume",
              new LinkOptions { Gateway = gateways, Store = new InMemoryLinkStore() },
              deadline.Token);
          hosting.SetRequestHandler(
              ConsumeContext.Default.Greeting,
              ConsumeContext.Default.Greeting,
              (greeting, _) => Task.FromResult(new Greeting($"hello {greeting.Name}")));

          await using ILink joining = await TailcatLink.JoinAsync(
              "consume",
              hosting.InvitationCode.Value,
              new LinkOptions { Gateway = gateways, Store = new InMemoryLinkStore() },
              deadline.Token);
          Greeting answer = await joining.RequestAsync(
              new Greeting("world"),
              ConsumeContext.Default.Greeting,
              ConsumeContext.Default.Greeting,
              deadline.Token);
          Console.WriteLine(answer.Name);

          Console.WriteLine(new ServiceCollection().AddTailcatLinkHost("consume").Count);

          internal sealed record Greeting(string Name);

          [JsonSerializable(typeof(Greeting))]
          internal sealed partial class ConsumeContext : JsonSerializerContext;
          CSHARP
          # Package source mapping, not just an extra source: with both
          # sources unmapped NuGet may serve Tailcat.Link from nuget.org, and
          # since the version here is the one already released, a commit that
          # breaks the bundling would pass against the published copy.
          cat > nuget.config <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="local" value="LOCAL_ARTIFACTS" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="Tailcat.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          XML
          sed -i "s|LOCAL_ARTIFACTS|$GITHUB_WORKSPACE/artifacts|" nuget.config
          for id in Tailcat.Link                     Tailcat.Link.Json                     Tailcat.Link.Extensions.DependencyInjection                     Tailcat.TestSupport; do
            dotnet add package "$id" --version "$version"
          done
          dotnet run

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.*nupkg

  # The second implementation of relay1. Its offline tests read the same record
  # vectors as Relay1VectorTests on the .NET side, so a wire format that drifts
  # apart fails here rather than waiting for somebody to run the interop by
  # hand against a live relay.
  browser-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/browser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm test
