name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # The zero-warning rule is only a rule if the build enforces it.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # The live tests dial Tailscale's public relays. They are opt-in so CI
      # neither depends on that service nor adds load to it; everything else
      # runs on every push.
      - name: Test
        run: dotnet test --no-build --configuration Release

  # Tailcat.Link bundles the assemblies of four projects that are not packages
  # of their own. That is easy to break without noticing, because the build
  # stays green either way — so the package is built and then actually
  # consumed on every push.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack --configuration Release -o artifacts

      - name: Consume the package
        run: |
          set -euo pipefail
          # Read the version off the package that was just built, so a bump to
          # VersionPrefix does not silently turn this check into a no-op.
          pkg=$(ls artifacts/Tailcat.Link.*.nupkg | head -1)
          version=${pkg#artifacts/Tailcat.Link.}
          version=${version%.nupkg}
          mkdir -p /tmp/consume && cd /tmp/consume
          dotnet new console -o app --force
          cd app
          # Runs code from every bundled layer, not just Tailcat.Link: an
          # assembly loads lazily, so merely naming a type the compiler can
          # resolve would still pass with the .dll missing from the package.
          # Sealing and opening a peer message goes through Tailcat.Net,
          # Tailcat's keys and libsodium at once, which is also what catches a
          # Sodium.Core dependency that the nuspec forgot to declare.
          cat > Program.cs <<'CSHARP'
          using Tailcat;
          using Tailcat.Derp;
          using Tailcat.Keys;
          using Tailcat.Link;
          using Tailcat.Net;

          Console.WriteLine(InvitationCode.TryParse("nonsense", out _));
          Console.WriteLine(typeof(ConnBlob).Assembly.GetName().Name);

          var host = NodePrivate.NewKey();
          var guest = NodePrivate.NewKey();
          byte[] ping = PeerMessage.Seal(PeerMessageType.Ping, "ping"u8, host, guest.Public());
          if (!PeerMessage.TryOpen(ping, guest, host.Public(), out _, out byte[]? payload))
          {
              throw new InvalidOperationException("the bundled Tailcat.Net could not open its own message");
          }
          Console.WriteLine(System.Text.Encoding.UTF8.GetString(payload));

          // A static property rather than a const, which the compiler would
          // inline and leave Tailcat.Derp.dll unloaded.
          Console.WriteLine(DerpProtocol.Magic.Length);
          Console.WriteLine(typeof(DerpClient).Assembly.GetName().Name);
          CSHARP
          dotnet nuget add source "$GITHUB_WORKSPACE/artifacts" --name local
          dotnet add package Tailcat.Link --version "$version"
          dotnet run

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.*nupkg
